name: eRISCV CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eriscv-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-rtl-checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install --yes verilator
      - name: Run source, TB-contract, and RTL checks
        run: |
          set -o pipefail
          mkdir -p build/ci
          make check 2>&1 | tee build/ci/static-checks.log
      - name: Publish static-check summary
        if: always()
        run: |
          python3 tools/project/write_ci_summary.py regression \
            --title "Static RTL checks" \
            --suite "Source, TB-contract, and lint=build/ci/static-checks.log" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload static-check diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-rtl-checks
          path: build/ci
          retention-days: 7
          if-no-files-found: warn

  pr-verilator-full:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Push/PR full Verilator (${{ matrix.product }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [m0, m1, m2]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install --yes verilator
      - name: Run full core and SoC regression without generated ACT4
        run: |
          set -o pipefail
          mkdir -p build/ci
          make eriscv-${{ matrix.product }}-full-no-act 2>&1 | tee build/ci/${{ matrix.product }}-full-no-act.log
      - name: Run committed ACT smoke
        run: |
          set -o pipefail
          mkdir -p build/ci
          make eriscv-${{ matrix.product }}-act-smoke 2>&1 | tee build/ci/${{ matrix.product }}-act-smoke.log
      - name: Publish PR regression summary
        if: always()
        run: |
          python3 tools/project/write_ci_summary.py regression \
            --title "Verilator regression (${{ matrix.product }})" \
            --suite "Full core and SoC (no ACT4)=build/ci/${{ matrix.product }}-full-no-act.log" \
            --suite "Committed ACT smoke=build/ci/${{ matrix.product }}-act-smoke.log" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload PR failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-verilator-${{ matrix.product }}
          path: |
            build/ci
            eriscv-${{ matrix.product }}/dv/core/sim/regression_logs
            eriscv-${{ matrix.product }}/dv/soc/sim/regression_logs
          retention-days: 7
          if-no-files-found: warn

  nightly-change-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Check nightly change window
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.detect.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes since the previous daily window
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual dispatch: run nightly jobs."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$(git log HEAD --since='24 hours ago' --format='%H' -1)" ]]; then
            echo "Commits found in the last 24 hours: run nightly jobs."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits found in the last 24 hours: skip nightly jobs."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  nightly-riscv-gcc:
    needs: nightly-change-gate
    if: needs.nightly-change-gate.outputs.should_run == 'true'
    name: Prepare RISC-V GCC 15.3
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Restore GCC 15.3 toolchain
        id: gcc-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/eriscv-toolchains/gcc-15.3
          key: ${{ runner.os }}-riscv64-unknown-elf-gcc-15.3.0-binutils-2.46.1-${{ hashFiles('tools/toolchain/bootstrap_riscv_gcc15.sh') }}
      - name: Install GCC build dependencies
        if: steps.gcc-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install --yes build-essential bison flex libgmp-dev libisl-dev libmpc-dev libmpfr-dev texinfo
      - name: Build GCC 15.3 toolchain
        if: steps.gcc-cache.outputs.cache-hit != 'true'
        run: tools/toolchain/bootstrap_riscv_gcc15.sh
      - name: Verify GCC 15.3 toolchain
        run: |
          export PATH="$HOME/.local/eriscv-toolchains/gcc-15.3/bin:$PATH"
          test "$(riscv64-unknown-elf-gcc -dumpfullversion -dumpversion)" = 15.3.0
          riscv64-unknown-elf-gcc --version | head -n 1

  nightly-full:
    needs: [nightly-change-gate, nightly-riscv-gcc]
    if: needs.nightly-change-gate.outputs.should_run == 'true'
    name: Nightly full ACT4 (${{ matrix.product }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        product: [m0, m1, m2]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install --yes verilator
      - name: Restore GCC 15.3 toolchain
        uses: actions/cache@v4
        with:
          path: ~/.local/eriscv-toolchains/gcc-15.3
          key: ${{ runner.os }}-riscv64-unknown-elf-gcc-15.3.0-binutils-2.46.1-${{ hashFiles('tools/toolchain/bootstrap_riscv_gcc15.sh') }}
      - name: Activate GCC 15.3
        run: echo "$HOME/.local/eriscv-toolchains/gcc-15.3/bin" >> "$GITHUB_PATH"
      - name: Identify ACT4 revision
        id: act4-revision
        run: echo "revision=$(git -C third_party/riscv-arch-test rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore ACT4 native environment
        id: act4-cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/act4
            eriscv-${{ matrix.product }}/compliance/riscv-arch-test/generated
          key: ${{ runner.os }}-act4-${{ matrix.product }}-${{ steps.act4-revision.outputs.revision }}-${{ hashFiles('tools/toolchain/bootstrap_riscv_gcc15.sh', 'third_party/riscv-arch-test/.mise.toml', 'tools/compliance/riscv-arch-test/bootstrap_act4_native.sh', 'tools/compliance/riscv-arch-test/act4-standard-env.sh', 'eriscv-m0/compliance/riscv-arch-test/profile.json', 'eriscv-m1/compliance/riscv-arch-test/profile.json', 'eriscv-m2/compliance/riscv-arch-test/profile.json', 'eriscv-m1/compliance/riscv-arch-test/u_profile.json', 'eriscv-m2/compliance/riscv-arch-test/u_profile.json', 'eriscv-m0/compliance/riscv-arch-test/test_config.yaml', 'eriscv-m1/compliance/riscv-arch-test/test_config.yaml', 'eriscv-m2/compliance/riscv-arch-test/test_config.yaml', 'eriscv-m1/compliance/riscv-arch-test/u_test_config.yaml', 'eriscv-m2/compliance/riscv-arch-test/u_test_config.yaml', 'eriscv-m0/compliance/riscv-arch-test/sail.json', 'eriscv-m1/compliance/riscv-arch-test/sail.json', 'eriscv-m2/compliance/riscv-arch-test/sail.json', 'eriscv-m0/compliance/riscv-arch-test/eriscv_mcu.yaml', 'eriscv-m1/compliance/riscv-arch-test/eriscv_mcu.yaml', 'eriscv-m2/compliance/riscv-arch-test/eriscv_mcu.yaml', 'eriscv-m0/compliance/riscv-arch-test/link.ld', 'eriscv-m1/compliance/riscv-arch-test/link.ld', 'eriscv-m2/compliance/riscv-arch-test/link.ld', 'eriscv-m0/compliance/riscv-arch-test/rvmodel_macros.h', 'eriscv-m1/compliance/riscv-arch-test/rvmodel_macros.h', 'eriscv-m2/compliance/riscv-arch-test/rvmodel_macros.h') }}
          restore-keys: |
            ${{ runner.os }}-act4-${{ matrix.product }}-
            ${{ runner.os }}-act4-
      - name: Bootstrap ACT4 host environment
        if: steps.act4-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p build/ci
          make act-bootstrap-native ACT_BOOTSTRAP_ARGS="--system-packages --mise --sail" 2>&1 | tee build/ci/act-bootstrap.log
      - name: Generate complete ACT4 cache
        if: steps.act4-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p build/ci
          make act-generate-${{ matrix.product }} 2>&1 | tee build/ci/${{ matrix.product }}-act-generate.log
      - name: Run full directed-core regression
        run: |
          set -o pipefail
          mkdir -p build/ci
          make -C eriscv-${{ matrix.product }}/dv/core/sim verilator TESTS="--directed-only" 2>&1 | tee build/ci/${{ matrix.product }}-core.log
      - name: Run full ACT4 regression
        run: |
          set -o pipefail
          mkdir -p build/ci
          make eriscv-${{ matrix.product }}-act 2>&1 | tee build/ci/${{ matrix.product }}-act.log
      - name: Run full SoC regression
        run: |
          set -o pipefail
          mkdir -p build/ci
          make eriscv-${{ matrix.product }}-soc 2>&1 | tee build/ci/${{ matrix.product }}-soc.log
      - name: Publish nightly regression summary
        if: always()
        run: |
          python3 tools/project/write_ci_summary.py regression \
            --title "Full ACT4 regression (${{ matrix.product }})" \
            --suite "Directed core=build/ci/${{ matrix.product }}-core.log" \
            --suite "ACT4=build/ci/${{ matrix.product }}-act.log" \
            --suite "SoC=build/ci/${{ matrix.product }}-soc.log" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload nightly failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-full-${{ matrix.product }}
          path: |
            build/ci
            eriscv-${{ matrix.product }}/dv/core/sim/regression_logs
            eriscv-${{ matrix.product }}/dv/soc/sim/regression_logs
          retention-days: 7
          if-no-files-found: warn

  nightly-ppa:
    needs: nightly-change-gate
    if: needs.nightly-change-gate.outputs.should_run == 'true'
    name: Nightly generic Liberty PPA
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      metrics_json: ${{ steps.metrics.outputs.ppa }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Restore Yosys/OpenSTA environment
        uses: actions/cache@v4
        with:
          path: |
            .cache/ppa/oss-cad
            .cache/ppa/prefix
            .cache/ppa/src
            .cache/ppa/build
            .cache/ppa/liberty
          key: ${{ runner.os }}-ppa-${{ hashFiles('tools/ppa/**', 'eriscv-m0/rtl/soc/clock_gate.sv', 'eriscv-m1/rtl/soc/clock_gate.sv', 'eriscv-m2/rtl/soc/clock_gate.sv') }}
          restore-keys: |
            ${{ runner.os }}-ppa-
      - name: Bootstrap Yosys/OpenSTA and generic Liberty
        run: make ppa-setup
      - name: Evaluate M0, M1, and M2
        run: |
          set -o pipefail
          source tools/ppa/env.sh
          mkdir -p build/ppa
          make ppa-all 2>&1 | tee build/ppa/nightly-ppa.log
      - name: Publish PPA summary
        id: metrics
        if: always()
        run: |
          python3 tools/project/write_ci_summary.py ppa --report-dir build/ppa >> "$GITHUB_STEP_SUMMARY"
          echo "ppa=$(python3 tools/project/write_ci_summary.py ppa --report-dir build/ppa --format json)" >> "$GITHUB_OUTPUT"
      - name: Upload PPA failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ppa-generic-liberty
          path: build/ppa
          retention-days: 7
          if-no-files-found: warn

  nightly-benchmarks:
    needs: [nightly-change-gate, nightly-riscv-gcc]
    if: needs.nightly-change-gate.outputs.should_run == 'true'
    name: Nightly benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      m0_metrics: ${{ steps.metrics.outputs.m0 }}
      m1_metrics: ${{ steps.metrics.outputs.m1 }}
      m2_metrics: ${{ steps.metrics.outputs.m2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout benchmark submodules
        run: git submodule update --init --depth 1 third_party/CoreMark third_party/embench-iot
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install --yes verilator
      - name: Restore GCC 15.3 toolchain
        uses: actions/cache@v4
        with:
          path: ~/.local/eriscv-toolchains/gcc-15.3
          key: ${{ runner.os }}-riscv64-unknown-elf-gcc-15.3.0-binutils-2.46.1-${{ hashFiles('tools/toolchain/bootstrap_riscv_gcc15.sh') }}
      - name: Activate GCC 15.3
        run: echo "$HOME/.local/eriscv-toolchains/gcc-15.3/bin" >> "$GITHUB_PATH"
      - name: Run all benchmark smokes
        run: |
          set -o pipefail
          mkdir -p build/nightly-benchmarks
          failed=0
          for product in m0 m1 m2; do
            if ! make eriscv-${product}-coremark 2>&1 | tee build/nightly-benchmarks/${product}-coremark.log; then failed=1; fi
            if ! make eriscv-${product}-dhrystone 2>&1 | tee build/nightly-benchmarks/${product}-dhrystone.log; then failed=1; fi
            if ! make eriscv-${product}-embench 2>&1 | tee build/nightly-benchmarks/${product}-embench.log; then failed=1; fi
          done
          exit "$failed"
      - name: Publish benchmark summaries
        id: metrics
        if: always()
        run: |
          matrix_args=(benchmark-matrix)
          for product in m0 m1 m2; do
            args=(benchmark --product "$product" --coremark "build/nightly-benchmarks/${product}-coremark.log" --dhrystone "build/nightly-benchmarks/${product}-dhrystone.log" --embench "build/nightly-benchmarks/${product}-embench.log")
            matrix_args+=(--product-logs "$product=build/nightly-benchmarks/${product}-coremark.log,build/nightly-benchmarks/${product}-dhrystone.log,build/nightly-benchmarks/${product}-embench.log")
            echo "$product=$(python3 tools/project/write_ci_summary.py "${args[@]}" --format json)" >> "$GITHUB_OUTPUT"
          done
          python3 tools/project/write_ci_summary.py "${matrix_args[@]}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmark-diagnostics
          path: |
            build/nightly-benchmarks
            eriscv-m0/sw/benchmarks/dhrystone/dmips_runs.csv
            eriscv-m1/sw/benchmarks/dhrystone/dmips_runs.csv
            eriscv-m2/sw/benchmarks/dhrystone/dmips_runs.csv
            eriscv-m0/sw/build
            eriscv-m1/sw/build
            eriscv-m2/sw/build
          retention-days: 7
          if-no-files-found: warn

  nightly-performance-history:
    needs: [nightly-change-gate, nightly-ppa, nightly-benchmarks]
    if: >-
      always() && needs.nightly-change-gate.outputs.should_run == 'true' &&
      needs.nightly-ppa.result == 'success' && needs.nightly-benchmarks.result == 'success'
    name: Publish nightly performance history
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check out or create the Pages branch
        id: pages
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages_dir="$(mktemp -d)"
          repo_url="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$repo_url" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$repo_url" "$pages_dir"
          else
            git init --initial-branch=gh-pages "$pages_dir"
            git -C "$pages_dir" remote add origin "$repo_url"
          fi
          echo "pages_dir=$pages_dir" >> "$GITHUB_OUTPUT"
      - name: Update dashboard data and publish
        env:
          PAGES_DIR: ${{ steps.pages.outputs.pages_dir }}
          PPA_METRICS: ${{ needs.nightly-ppa.outputs.metrics_json }}
          M0_METRICS: ${{ needs.nightly-benchmarks.outputs.m0_metrics }}
          M1_METRICS: ${{ needs.nightly-benchmarks.outputs.m1_metrics }}
          M2_METRICS: ${{ needs.nightly-benchmarks.outputs.m2_metrics }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 tools/project/publish_performance_history.py \
            --site-dir "$PAGES_DIR" \
            --timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --sha "$GITHUB_SHA" \
            --run-url "$run_url" \
            --ppa "$PPA_METRICS" \
            --benchmark "$M0_METRICS" \
            --benchmark "$M1_METRICS" \
            --benchmark "$M2_METRICS"
          git -C "$PAGES_DIR" config user.name 'github-actions[bot]'
          git -C "$PAGES_DIR" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$PAGES_DIR" add index.html data/history.json
          git -C "$PAGES_DIR" commit -m "ci: nightly performance ${GITHUB_SHA::7}"
          git -C "$PAGES_DIR" push origin HEAD:gh-pages
          page_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          {
            echo "### Performance history"
            echo
            echo "Published [nightly metrics dashboard]($page_url)."
            echo "If this is the first publication, enable GitHub Pages from the `gh-pages` branch root."
          } >> "$GITHUB_STEP_SUMMARY"
