name: RTL checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verilator-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check original-source SPDX headers
        run: make copyright-check
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install --yes verilator
      - name: Lint M0, M1, and M2 SoC RTL
        run: make lint-all
      - name: Run M0 smoke without ACT4 cache
        run: make eriscv-m0-smoke-no-act
      - name: Run M1 smoke without ACT4 cache
        run: make eriscv-m1-smoke-no-act
      - name: Run M2 smoke without ACT4 cache
        run: make eriscv-m2-smoke-no-act
