# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json

# ACT4 DUT declaration for the eRISCV-M0 product profile.
# This describes the product contract, not the older edu-rv32i-5s CPU-only
# Phase 12 validation boundary.
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: eriscv_m0
description: eRISCV-M0 RV32IC_Zicsr_Zifencei_Zicntr_Zihpm_Zihintpause M-mode-only MCU profile
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: C, version: "= 2.0" }
  # UDB models the mandatory RV32C base through decomposed Zca.
  # ACT4 selects the RV32C base instruction tests through the Zca bucket.
  - { name: Zca, version: "= 1.0" }
  - { name: Zicsr, version: "= 2.0" }
  - { name: Zifencei, version: "= 2.0.0" }
  - { name: Zicntr, version: "= 2.0" }
  - { name: Zihpm, version: "= 2.0" }
  - { name: Zihintpause, version: "= 2.0.0" }
  - { name: Sm, version: "= 1.12.0" }

params:
  # XLEN / addressing
  MXLEN: 32
  PHYS_ADDR_WIDTH: 32

  # eRISCV-M0 implements misa and advertises RV32IC. Implementation/vendor IDs
  # are not part of the product claim today.
  MISA_CSR_IMPLEMENTED: true
  MUTABLE_MISA_C: false
  MARCHID_IMPLEMENTED: false
  MIMPID_IMPLEMENTED: false
  VENDOR_ID_BANK: 0x0
  VENDOR_ID_OFFSET: 0x0
  CONFIG_PTR_ADDRESS: 0x0

  # Endianness
  M_MODE_ENDIANNESS: little

  # Machine-mode synchronous trap behavior in the eriscv-m0 contract.
  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_EBREAK: true
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  TRAP_ON_UNIMPLEMENTED_CSR: true
  TRAP_ON_ILLEGAL_WLRL: false

  # Current mtval contract follows the implemented core baseline.
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: false
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: false
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: false
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: false
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: true
  MTVAL_WIDTH: 32

  # Misaligned loads/stores trap; they are not transparently completed.
  MISALIGNED_LDST: false
  MISALIGNED_LDST_EXCEPTION_PRIORITY: low

  # eriscv-m0 is M-mode only and mtvec direct-mode only today.
  MTVEC_MODES: [0]
  MTVEC_ACCESS: rw
  MTVEC_BASE_ALIGNMENT_DIRECT: 4
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: custom

  # RV32C enables halfword instruction alignment.
  PRECISE_SYNCHRONOUS_EXCEPTIONS: true
  PMA_GRANULARITY: 2

  # eRISCV-M0 implements Zicntr plus HPM3..6 selected by mhpmevent3..6.
  TIME_CSR_IMPLEMENTED: true
  HPM_COUNTER_EN:
    [
      false,
      false,
      false,
      true,
      true,
      true,
      true,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]
  HPM_EVENTS: [0, 4, 6, 7, 8, 9, 10, 11, 14, 18, 19]
  # Machine counters are individually inhibitable through bits 0 and 2..6.
  MCOUNTINHIBIT_IMPLEMENTED: true
  COUNTINHIBIT_EN:
    [
      true,
      false,
      true,
      true,
      true,
      true,
      true,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]
  MCOUNTENABLE_EN:
    [
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]

  # No PMP support in eriscv-m0.
  NUM_PMP_ENTRIES: 0
