# eRISCV-M1 RISC-V OpenOCD target configuration.
# Source this after an adapter/interface config.

if {![info exists CHIPNAME]} {
    set CHIPNAME eriscv_m1
}

if {![info exists CPUTAPID]} {
    # Tighten after final product IDCODE freeze if needed.
    set CPUTAPID 0x135711db
}

jtag newtap $CHIPNAME cpu -irlen 5 -expected-id $CPUTAPID

target create $CHIPNAME.cpu riscv -chain-position $CHIPNAME.cpu

# eRISCV-M1 currently uses Debug Module abstract register access; no SBA claim.
riscv set_command_timeout_sec 5

init
halt
