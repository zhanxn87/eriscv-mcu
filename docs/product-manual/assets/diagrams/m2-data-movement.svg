<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">eRISCV-M2 compute and data-movement boundary</title>
  <desc id="desc">CPU local ITCM and DTCM sit with a 16-entry PMP in the CPU-local portion of the design. PMP checks CPU accesses only. Generic DMA operates on System SRAM with a fixed UART0 transmit endpoint and is not checked by PMP.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#69ddd1"/></marker></defs>
  <style>text{font-family:Inter,Arial,sans-serif;fill:#dff3f4}.title{font-size:21px;font-weight:700}.label{font-size:15px;font-weight:700}.small{font-size:12px;fill:#a9cfd3}.box{fill:#103a4e;stroke:#5c9dae;stroke-width:1.5}.pmp{fill:#5b4122;stroke:#ffb45d;stroke-width:1.5}.bank{fill:#155771;stroke:#77c3cc;stroke-width:1}.edge{stroke:#69ddd1;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.rule{stroke:#5c9dae;stroke-width:1}</style>
  <rect width="960" height="500" rx="16" fill="#08283a"/>
  <text x="48" y="52" class="title">M2 compute and data-movement boundary</text>
  <text x="48" y="77" class="small">Directly addressed, cacheless memories. Ownership is software-visible; no cache-maintenance protocol exists.</text>
  <rect x="48" y="125" width="215" height="270" rx="10" class="box"/>
  <text x="72" y="163" class="label">RV32IMFC CPU</text>
  <text x="72" y="187" class="small">M/U mode · RV32F / FPU</text>
  <line x1="72" y1="210" x2="238" y2="210" class="rule"/>
  <text x="72" y="242" class="label">ITCM</text><text x="72" y="263" class="small">128 KiB executable local SRAM</text>
  <text x="72" y="300" class="label">DTCM</text><text x="72" y="321" class="small">128 KiB data local SRAM</text>
  <rect x="72" y="339" width="166" height="42" rx="7" class="pmp"/>
  <text x="86" y="358" class="label">PMP</text>
  <text x="86" y="375" class="small">16 entries · CPU access checks</text>
  <rect x="345" y="108" width="360" height="310" rx="10" class="box"/>
  <text x="371" y="145" class="label">System SRAM · 512 KiB</text>
  <text x="371" y="168" class="small">0x8000_0000–0x8007_FFFF · CPU/DMA shared buffer region</text>
  <g transform="translate(371 202)"><rect width="66" height="112" rx="4" class="bank"/><rect x="73" width="66" height="112" rx="4" class="bank"/><rect x="146" width="66" height="112" rx="4" class="bank"/><rect x="219" width="66" height="112" rx="4" class="bank"/><rect x="292" width="42" height="112" rx="4" class="bank"/><text x="10" y="40" class="label">B0</text><text x="6" y="63" class="small">64 KiB</text><text x="83" y="40" class="label">B1</text><text x="79" y="63" class="small">64 KiB</text><text x="156" y="40" class="label">B2</text><text x="152" y="63" class="small">64 KiB</text><text x="229" y="40" class="label">B3</text><text x="225" y="63" class="small">64 KiB</text><text x="300" y="40" class="label">…</text><text x="292" y="63" class="small">B7</text></g>
  <text x="371" y="355" class="small">Different banks can proceed concurrently; same-bank CPU/DMA traffic serializes.</text>
  <rect x="770" y="154" width="142" height="104" rx="10" class="box"/>
  <text x="792" y="190" class="label">Generic DMA</text><text x="792" y="213" class="small">one channel</text><text x="792" y="234" class="small">direct / descriptor</text>
  <rect x="770" y="324" width="142" height="58" rx="10" class="box"/><text x="795" y="357" class="label">UART0 TX</text>
  <path d="M263 197H336" class="edge"/><path d="M705 257H761" class="edge"/><path d="M841 260V315" class="edge"/>
  <text x="741" y="121" class="small">System SRAM only</text><text x="755" y="406" class="small">No UART RX, SPI, Timer,</text><text x="755" y="423" class="small">ITCM, DTCM, or arbitrary MMIO</text>
</svg>
