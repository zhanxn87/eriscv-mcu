<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">eRISCV MCU family overview</title><desc id="desc">A common platform supports M0, M1, and M2, each adding deliberate capabilities.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0a354b"/><stop offset="1" stop-color="#104f68"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".22"/></filter></defs>
  <rect width="760" height="520" rx="16" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="42" y="54" fill="#8eeade" font-size="14" font-weight="700" letter-spacing="3">COMMON PLATFORM</text><text x="42" y="87" fill="#eaf9fb" font-size="23" font-weight="700">RV32 · Interrupts · Debug · HPM · Deterministic memory</text>
  <g filter="url(#shadow)"><rect x="42" y="130" width="676" height="85" rx="9" fill="#d9edf0"/><text x="67" y="164" fill="#0c3d50" font-size="16" font-weight="700">Shared execution platform</text><text x="67" y="190" fill="#365b68" font-size="14">M-mode traps · PLIC · CLINT · JTAG · Zicntr/Zihpm · no-cache rule</text></g>
  <path d="M160 215v42M380 215v42M600 215v42" stroke="#8eeade" stroke-width="3"/><path d="M160 257h440" stroke="#8eeade" stroke-width="3"/>
  <g filter="url(#shadow)"><rect x="42" y="282" width="205" height="184" rx="10" fill="#d9edf0"/><text x="66" y="320" fill="#15516a" font-size="13" font-weight="700" letter-spacing="2">ERISCV-M0</text><text x="66" y="355" fill="#122b39" font-size="23" font-weight="700">Compact</text><text x="66" y="387" fill="#365b68" font-size="14">RV32IC</text><text x="66" y="410" fill="#365b68" font-size="14">Machine mode</text><text x="66" y="433" fill="#365b68" font-size="14">Local memories</text></g>
  <g filter="url(#shadow)"><rect x="278" y="282" width="205" height="184" rx="10" fill="#b8d8e3"/><text x="302" y="320" fill="#15516a" font-size="13" font-weight="700" letter-spacing="2">ERISCV-M1</text><text x="302" y="355" fill="#122b39" font-size="23" font-weight="700">Protected</text><text x="302" y="387" fill="#365b68" font-size="14">RV32IMC</text><text x="302" y="410" fill="#365b68" font-size="14">User mode + PMP</text><text x="302" y="433" fill="#365b68" font-size="14">M extension</text></g>
  <g filter="url(#shadow)"><rect x="514" y="282" width="204" height="184" rx="10" fill="#15a89f"/><text x="538" y="320" fill="#053943" font-size="13" font-weight="700" letter-spacing="2">ERISCV-M2</text><text x="538" y="355" fill="#062b38" font-size="23" font-weight="700">Compute</text><text x="538" y="387" fill="#063b49" font-size="14">RV32IMFC + Zba/Zcf</text><text x="538" y="410" fill="#063b49" font-size="14">System SRAM</text><text x="538" y="433" fill="#063b49" font-size="14">DMA + RV32F</text></g></g>
</svg>
